    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1F1F1F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="14" fill="#0D0D0D"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="13.5" fill="none" stroke="#262626"/>

  <!-- Subtle dot accents -->
  <circle cx="980" cy="64" r="1.5" fill="#404040"/>
  <circle cx="1040" cy="112" r="1.5" fill="#525252"/>
  <circle cx="1110" cy="78" r="1" fill="#404040"/>
  <circle cx="1075" cy="175" r="1.5" fill="#333333"/>
  <circle cx="920" cy="210" r="1" fill="#404040"/>

  <!-- Status pill -->
  <g transform="translate(64, 52)">
    <rect x="0" y="0" width="276" height="28" rx="14" fill="#171717" stroke="#2E2E2E"/>
    <circle cx="16" cy="14" r="3.5" fill="#FAF9F6"/>
    <text x="28" y="18" fill="#D4D4D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">OPEN TO JUNIOR DEV &amp; INTERNSHIPS</text>
