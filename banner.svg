  <text x="64" y="184" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Junior Full Stack Web Developer  ·  Offline AI &amp; Privacy-First Systems</text>

  <!-- Footer Metadata -->
